<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Storm Signal serverless architecture</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#16181b"/>
    </marker>
  </defs>
  <rect width="1200" height="560" fill="#f4f2ec"/>
  <text x="40" y="52" font-size="28" font-weight="700" fill="#16181b" font-family="Georgia, serif">Storm Signal — serverless architecture</text>
  <text x="40" y="80" font-size="15" fill="#5b5f66">No servers, no pipeline: one SAM template, deployed manually. Everything inside the dashed box is in AWS (us-east-1).</text>

  <!-- user -->
  <rect x="40" y="230" width="150" height="90" fill="#fbfaf6" stroke="#16181b" stroke-width="1.5"/>
  <text x="115" y="268" text-anchor="middle" font-size="17" font-weight="700" fill="#16181b">Browser</text>
  <text x="115" y="292" text-anchor="middle" font-size="13" fill="#5b5f66">React + TypeScript</text>
  <text x="115" y="310" text-anchor="middle" font-size="12" fill="#5b5f66">checklist in localStorage</text>

  <!-- AWS boundary -->
  <rect x="240" y="110" width="700" height="420" fill="none" stroke="#16181b" stroke-width="1.2" stroke-dasharray="7 5"/>
  <text x="256" y="134" font-size="13" font-weight="700" fill="#5b5f66" letter-spacing="1.5">AWS</text>

  <!-- CloudFront -->
  <rect x="270" y="225" width="180" height="100" fill="#fbfaf6" stroke="#16181b" stroke-width="1.5"/>
  <text x="360" y="262" text-anchor="middle" font-size="17" font-weight="700" fill="#16181b">CloudFront</text>
  <text x="360" y="285" text-anchor="middle" font-size="13" fill="#5b5f66">HTTPS · one origin</text>
  <text x="360" y="304" text-anchor="middle" font-size="12" fill="#5b5f66">security headers · cache</text>

  <!-- S3 -->
  <rect x="520" y="150" width="170" height="80" fill="#fbfaf6" stroke="#16181b" stroke-width="1.5"/>
  <text x="605" y="185" text-anchor="middle" font-size="17" font-weight="700" fill="#16181b">S3 (private)</text>
  <text x="605" y="208" text-anchor="middle" font-size="13" fill="#5b5f66">static app build</text>

  <!-- API GW -->
  <rect x="520" y="320" width="170" height="90" fill="#fbfaf6" stroke="#16181b" stroke-width="1.5"/>
  <text x="605" y="355" text-anchor="middle" font-size="17" font-weight="700" fill="#16181b">API Gateway</text>
  <text x="605" y="377" text-anchor="middle" font-size="13" fill="#5b5f66">HTTP API</text>
  <text x="605" y="396" text-anchor="middle" font-size="12" fill="#5b5f66">throttled 5 rps / burst 10</text>

  <!-- Lambda -->
  <rect x="740" y="300" width="180" height="130" fill="#fbfaf6" stroke="#9a4607" stroke-width="2.5"/>
  <text x="830" y="333" text-anchor="middle" font-size="17" font-weight="700" fill="#16181b">Lambda</text>
  <text x="830" y="355" text-anchor="middle" font-size="12" fill="#5b5f66">Node 22 · arm64 · ≤3 concurrent</text>
  <text x="830" y="378" text-anchor="middle" font-size="13" fill="#16181b">nwsClient</text>
  <text x="830" y="397" text-anchor="middle" font-size="13" fill="#16181b">riskEngine (rules)</text>
  <text x="830" y="416" text-anchor="middle" font-size="12" fill="#5b5f66">in-memory cache</text>

  <!-- CloudWatch -->
  <rect x="740" y="460" width="180" height="56" fill="#fbfaf6" stroke="#16181b" stroke-width="1.2"/>
  <text x="830" y="485" text-anchor="middle" font-size="15" font-weight="700" fill="#16181b">CloudWatch</text>
  <text x="830" y="504" text-anchor="middle" font-size="12" fill="#5b5f66">JSON logs (7 d) · error alarm</text>

  <!-- NWS -->
  <rect x="990" y="270" width="180" height="190" fill="#fbfaf6" stroke="#16181b" stroke-width="1.5"/>
  <text x="1080" y="302" text-anchor="middle" font-size="16" font-weight="700" fill="#16181b">api.weather.gov</text>
  <text x="1080" y="322" text-anchor="middle" font-size="12" fill="#5b5f66">National Weather Service</text>
  <text x="1006" y="352" font-size="12.5" fill="#16181b">• point metadata</text>
  <text x="1006" y="372" font-size="12.5" fill="#16181b">• hourly forecast</text>
  <text x="1006" y="392" font-size="12.5" fill="#16181b">• gridpoint: gusts, thunder,</text>
  <text x="1018" y="410" font-size="12.5" fill="#16181b">snow, ice, feels-like</text>
  <text x="1006" y="430" font-size="12.5" fill="#16181b">• station observation</text>
  <text x="1006" y="450" font-size="12.5" fill="#16181b">• active alerts</text>

  <!-- arrows -->
  <g stroke="#16181b" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M190 275 H268"/>
    <path d="M450 255 C490 255 490 190 518 190"/>
    <path d="M450 295 C490 295 490 365 518 365"/>
    <path d="M690 365 H738"/>
    <path d="M920 365 H988"/>
    <path d="M830 430 V458"/>
  </g>
  <text x="212" y="265" text-anchor="middle" font-size="12" fill="#5b5f66">HTTPS</text>
  <text x="420" y="180" font-size="12" fill="#5b5f66">/* via OAC</text>
  <text x="440" y="390" font-size="12" fill="#5b5f66">/api/*</text>
  <text x="954" y="355" text-anchor="middle" font-size="12" fill="#5b5f66">GET</text>

  <!-- shared engine note -->
  <rect x="40" y="380" width="180" height="120" fill="#ece8fb" stroke="#5136c4" stroke-width="1.2"/>
  <text x="130" y="408" text-anchor="middle" font-size="13" font-weight="700" fill="#16181b">Same rule engine</text>
  <text x="130" y="428" text-anchor="middle" font-size="12" fill="#16181b">runs in the browser for</text>
  <text x="130" y="446" text-anchor="middle" font-size="12" fill="#16181b">What If? and Storm Prep,</text>
  <text x="130" y="464" text-anchor="middle" font-size="12" fill="#16181b">so results match Lambda</text>
  <text x="130" y="482" text-anchor="middle" font-size="12" fill="#16181b">and respond instantly</text>
  <path d="M115 322 V378" stroke="#5136c4" stroke-width="1.4" stroke-dasharray="4 4"/>
</svg>
